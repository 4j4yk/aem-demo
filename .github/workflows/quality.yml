name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - name: Start AEM local proxy
        run: npx -y @adobe/aem-cli up --no-open &
      - name: Wait for local site
        run: npx wait-on http://localhost:3000
      - run: npm run test:e2e
      - name: Lighthouse budgets
        run: npx -y @lhci/cli autorun

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,429 README.md docs/**/*.md
