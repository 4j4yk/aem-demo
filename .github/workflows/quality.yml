name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - name: Test published AEM content
        env:
          TEST_BASE_URL: https://main--aem-demo--4j4yk.aem.live
        run: npx playwright test tests/newsroom.spec.js
      - name: Start local block server and wait for readiness
        run: |
          python3 -m http.server 3000 > /tmp/aem-blocks.log 2>&1 &
          echo $! > /tmp/aem-blocks.pid
          npx wait-on --timeout 30000 http://localhost:3000
      - name: Test aviation catalog block
        run: npx playwright test tests/aviation-catalog.spec.js
      - name: Lighthouse budgets
        run: npx -y @lhci/cli autorun
      - name: Stop local block server
        if: always()
        run: |
          test ! -f /tmp/aem-blocks.pid || kill "$(cat /tmp/aem-blocks.pid)" || true
          test -f /tmp/aem-blocks.log && tail -n 100 /tmp/aem-blocks.log || true

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,429 README.md docs/**/*.md
